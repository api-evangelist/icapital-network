aid: icapital-network
name: iCapital Network
description: 'iCapital (Institutional Capital Network, Inc.) is a New York-headquartered
  financial technology company, founded in 2013, that operates the alternative investments
  marketplace and the operating infrastructure behind it. Its platform lets wealth
  managers, RIAs, family offices and institutional investors research, subscribe to,
  service and report on private markets funds, hedge funds, structured investments,
  annuities, model portfolios and separately managed accounts, while asset managers
  use it to distribute those products into the wealth channel. iCapital Marketplace
  advertises access to funds from 700+ asset managers and reports $945B+ in global
  platform assets. Around the marketplace sit Architect (portfolio construction and
  analytics), Data Solutions (alternative data management and consolidated reporting),
  Identity Solutions (KYC/AML), and iCapital DLT, an API-first distributed ledger
  platform built on the Canton Network. Integration with custodians, fund administrators,
  transfer agents and advisor platforms (BNY, Fidelity, Envestnet, Orion, Morningstar,
  Vestmark, TradePMR, GeoWealth, Ultimus, UMB) happens through SSO, embedded workflows
  and partner data integrations. As of the 2026-08-01 enrichment pass iCapital publishes
  no public developer portal, API reference, machine-readable API contract or client
  SDKs; API documentation is described as available to integration partners only,
  through the sales and technical-support organization.'
